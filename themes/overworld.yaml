  # Cards as windows. Without card-mod: a 3px frame and a 1px inner line (plain box-shadow, also frames badges).
  # With card-mod the stepped frame (overworld-frame-image) replaces both.
  card-background-color: "#131b3e"
  ha-card-background: "#131b3e"
  ha-card-border-color: "var(--overworld-line)"
  ha-card-border-width: "3px"
  ha-card-border-radius: "0px"
  ha-card-box-shadow: "inset 0 0 0 2px var(--overworld-window), inset 0 0 0 3px var(--overworld-line)"
  ha-badge-border-radius: "0px"
  ha-card-header-font-family: "var(--ha-font-family-heading)"
  ha-card-header-font-size: "16px"

  # No round corners anywhere: pixels are square
  ha-border-radius-sm: "0px"
  ha-border-radius-md: "0px"
  ha-border-radius-lg: "0px"
  ha-border-radius-xl: "0px"
  ha-border-radius-2xl: "0px"
  ha-border-radius-3xl: "0px"
  ha-border-radius-4xl: "0px"
  ha-border-radius-5xl: "0px"
  ha-border-radius-6xl: "0px"
  ha-border-radius-pill: "0px"
  ha-border-radius-circle: "0px"
  ha-tile-icon-border-radius: "0px"
  ha-picture-border-radius: "0px"
  ha-card-features-border-radius: "0px"
  control-slider-border-radius: "0px"
  wa-border-radius-s: "0px"
  wa-border-radius-m: "0px"
  wa-border-radius-l: "0px"
  wa-border-radius-pill: "0px"
  wa-form-control-border-radius: "0px"
  wa-panel-border-radius: "0px"
  # Hard pixel shadows instead of soft blur
  ha-box-shadow-s: "2px 2px 0 rgba(0,0,0,.45)"
  ha-box-shadow-m: "3px 3px 0 rgba(0,0,0,.45)"
  ha-box-shadow-l: "4px 4px 0 rgba(0,0,0,.45)"
  wa-shadow-s: "2px 2px 0 rgba(0,0,0,.45)"
  wa-shadow-m: "3px 3px 0 rgba(0,0,0,.45)"
  wa-shadow-l: "4px 4px 0 rgba(0,0,0,.45)"

  # Dialogs: the same window frame, drawn outside the surface
  ha-dialog-border-radius: "0px"
  ha-dialog-surface-background: "#18224a"
  mdc-theme-surface: "#18224a"
  dialog-box-shadow: "0 0 0 3px var(--overworld-line), 0 0 0 6px var(--overworld-page), 6px 6px 0 6px rgba(0,0,0,.5)"
  ha-dialog-scrim-backdrop-filter: "none"
  mdc-dialog-scrim-color: "rgba(4,8,24,.72)"

  # Header and sidebar
  app-header-background-color: "#0b1230"
  app-header-text-color: "#f1ecdc"
  app-header-border-bottom: "3px solid var(--overworld-line)"
  sidebar-background-color: "#0b1230"
  sidebar-text-color: "#f1ecdc"
  sidebar-icon-color: "#aab3d8"
  sidebar-selected-text-color: "#f1ecdc"
  sidebar-selected-icon-color: "#5aaeff"
  sidebar-menu-button-text-color: "#f1ecdc"
  scrollbar-thumb-color: "#384270"

  # Inputs and forms
  input-fill-color: "#0e1534"
  input-ink-color: "var(--primary-text-color)"
  input-label-ink-color: "var(--secondary-text-color)"
  input-idle-line-color: "#6f79a8"
  input-hover-line-color: "var(--primary-color)"
  input-outlined-idle-border-color: "#6f79a8"
  input-outlined-hover-border-color: "var(--primary-color)"
  mdc-text-field-fill-color: "#0e1534"
  mdc-select-fill-color: "#0e1534"
  ha-color-form-background: "#0e1534"
  code-editor-background-color: "#0e1534"
  markdown-code-background-color: "#0e1534"
  clear-background-color: "#18224a"
  switch-checked-button-color: "var(--primary-color)"
  switch-checked-track-color: "var(--primary-color)"
  switch-unchecked-button-color: "#aab3d8"
  switch-unchecked-track-color: "#384270"

  # Typography: the pixel font of the Overworld Pixels module first, the system monospace as fallback
  ha-font-family-body: "'Overworld Pixel', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
  ha-font-family-heading: "'Overworld Pixel', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
  ha-font-family-longform: "'Overworld Pixel', ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace"
  ha-font-family-code: "ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
  code-font-family: "ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace"
  ha-font-weight-medium: "400"
  ha-font-weight-bold: "700"
  ha-heading-card-title-font-weight: "400"
  ha-section-grid-row-height: "64px"
  ha-font-weight-normal: "400"
  ha-font-smoothing: "none"
  # A pixel font only looks right at whole multiples of its grid: 16px (art pixel 2px) for all text and titles,
  # 24/48/64px for big numbers. No font smoothing, so the pixels stay hard.
  ha-font-size-xs: "16px"
  ha-font-size-s: "16px"
  ha-font-size-m: "16px"
  ha-font-size-l: "16px"
  ha-font-size-xl: "16px"
  ha-font-size-2xl: "24px"
  ha-font-size-3xl: "24px"
  ha-font-size-4xl: "48px"
  ha-font-size-5xl: "64px"
  ha-line-height-condensed: "1.25"
  ha-line-height-normal: "1.5"
  # Windows need a little air between their frames
  ha-section-grid-row-gap: "12px"
  ha-section-grid-column-gap: "12px"

  # A small palette like an old console: lights yellow, safety green, alarms red, media purple
  success-color: "#63d86a"
  warning-color: "#ff9a4d"
  error-color: "#ff6b6b"
  info-color: "#5aaeff"
  amber-color: "#ffd447"
