  # Optional, card-mod 4.x. Stepped window frames with a pixel shadow. Tiles of switchable entities that are on get
  # a dithered fill and a pixel cursor in front of the icon.
  # The domain list matters: the tile card marks any entity with a value as active, sensors included.
  # Tiles with the class overworld-blocks (card_mod: class: overworld-blocks) get their first feature row, a slider,
  # cut into ten blocks. Opt-in, because the same mask would cut button rows apart.
  card-mod-card: |
    ha-card {
      border-width: 6px;
      border-style: solid;
      border-image: var(--overworld-frame-image) 3 / 6px / 0 stretch;
      image-rendering: pixelated;
      background-clip: padding-box;
      box-shadow: none;
      filter: var(--overworld-shadow);
    }
    ha-card.active:has(ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=cover], [data-domain=vacuum])) {
      background-image: conic-gradient(var(--overworld-dither) 25%, transparent 0 50%, var(--overworld-dither) 0 75%, transparent 0);
      background-size: 4px 4px;
    }
    .card-header, .content.title {
      text-transform: uppercase;
      font-family: var(--ha-font-family-heading);
      font-weight: 400;
      letter-spacing: .06em;
    }
    ha-card:has(ha-tile-container[focused]) {
      outline: 2px solid var(--primary-color);
      outline-offset: -8px;
    }
    ha-tile-icon { margin-inline-start: 10px; }
    hui-card-features { --feature-button-spacing: 8px; }
    :host(hui-thermostat-card) .title { text-transform: uppercase; letter-spacing: .06em; }
    .temp-attribute { flex-shrink: 0; }
    .temp-attribute .temp { margin-right: 1.2em !important; }
    ha-card.active ha-tile-icon:is([data-domain=light], [data-domain=switch], [data-domain=fan], [data-domain=media_player], [data-domain=climate], [data-domain=input_boolean], [data-domain=humidifier], [data-domain=water_heater], [data-domain=vacuum], [data-domain=remote], [data-domain=siren], [data-domain=automation], [data-domain=script], [data-domain=cover])::before {
      content: "";
      position: absolute;
      inset-inline-start: -12px;
      top: calc(50% - 7px);
      width: 2px;
      height: 2px;
      background: var(--overworld-cursor);
      box-shadow: 0px 2px 0 var(--overworld-cursor), 2px 2px 0 var(--overworld-cursor), 0px 4px 0 var(--overworld-cursor), 2px 4px 0 var(--overworld-cursor), 4px 4px 0 var(--overworld-cursor), 0px 6px 0 var(--overworld-cursor), 2px 6px 0 var(--overworld-cursor), 4px 6px 0 var(--overworld-cursor), 6px 6px 0 var(--overworld-cursor), 0px 8px 0 var(--overworld-cursor), 2px 8px 0 var(--overworld-cursor), 4px 8px 0 var(--overworld-cursor), 0px 10px 0 var(--overworld-cursor), 2px 10px 0 var(--overworld-cursor), 0px 12px 0 var(--overworld-cursor);
    }
    :host(.overworld-blocks) hui-card-features {
      -webkit-mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 4px), transparent calc(10% - 4px) 10%) 0 0 / 100% var(--feature-height) no-repeat content-box, linear-gradient(transparent var(--feature-height), #000 var(--feature-height)) border-box;
      mask: repeating-linear-gradient(90deg, #000 0 calc(10% - 4px), transparent calc(10% - 4px) 10%) 0 0 / 100% var(--feature-height) no-repeat content-box, linear-gradient(transparent var(--feature-height), #000 var(--feature-height)) border-box;
      background: linear-gradient(var(--input-idle-line-color), var(--input-idle-line-color)) 0 0 / 100% var(--feature-height) no-repeat content-box;
    }
  # Optional, card-mod 4.x: the more-info dialog uses the theme font too
  card-mod-more-info: |
    :host { font-family: var(--ha-font-family-body); }
  # Optional, card-mod 4.x: the sidebar becomes the menu window with a cursor on the selected entry
  card-mod-sidebar: |
    :host {
      border-inline-end: 3px solid var(--overworld-line);
      font-family: var(--ha-font-family-body);
    }
    ha-list-item-button.selected::after {
      content: "";
      position: absolute;
      inset-inline-start: 4px;
      top: calc(50% - 7px);
      width: 2px;
      height: 2px;
      background: var(--overworld-cursor);
      box-shadow: 0px 2px 0 var(--overworld-cursor), 2px 2px 0 var(--overworld-cursor), 0px 4px 0 var(--overworld-cursor), 2px 4px 0 var(--overworld-cursor), 4px 4px 0 var(--overworld-cursor), 0px 6px 0 var(--overworld-cursor), 2px 6px 0 var(--overworld-cursor), 4px 6px 0 var(--overworld-cursor), 6px 6px 0 var(--overworld-cursor), 0px 8px 0 var(--overworld-cursor), 2px 8px 0 var(--overworld-cursor), 4px 8px 0 var(--overworld-cursor), 0px 10px 0 var(--overworld-cursor), 2px 10px 0 var(--overworld-cursor), 0px 12px 0 var(--overworld-cursor);
    }

